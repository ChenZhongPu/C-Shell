# Continuous verification. Build artifacts here are throwaway (90-day
# retention, login required to download); user-facing binaries come from
# release.yml instead.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-gcc
            cc: gcc
            sanitizers: all
          - os: ubuntu-latest
            name: linux-clang
            cc: clang
            sanitizers: all
          - os: macos-latest
            name: macos-clang
            cc: clang
            sanitizers: all
          # cl.exe via a Developer Command Prompt environment — the only
          # place the MSVC flag dialect gets exercised at all.
          - os: windows-latest
            name: windows-msvc
            msvc: true
            cc: cl
            sanitizers: address
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      C_SHELL_TEST_REQUIRE_SANITIZERS: ${{ matrix.sanitizers }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.msvc

      - name: Install Linux compilers and sanitizer runtimes
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc clang libclang-rt-dev

      - name: Require the MSVC AddressSanitizer component
        if: matrix.msvc
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.ASAN -property installationPath
          if (-not $installation) { throw 'The CI image must provide the MSVC AddressSanitizer component.' }

      - name: Show detected C compilers
        shell: bash
        run: |
          for c in cc gcc clang cl; do
            command -v "$c" >/dev/null 2>&1 && echo "$c -> $(command -v "$c")" || true
          done

      - run: cargo test --all-targets

      - run: cargo build --release

      - name: Stage binary
        shell: bash
        run: |
          mkdir stage
          cp "target/release/c-shell${{ runner.os == 'Windows' && '.exe' || '' }}" stage/

      - uses: actions/upload-artifact@v4
        with:
          name: c-shell-dev-${{ matrix.name }}
          path: stage/
