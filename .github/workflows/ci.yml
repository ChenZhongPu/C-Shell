# Continuous verification. Build artifacts here are throwaway (90-day
# retention, login required to download); user-facing binaries come from
# release.yml instead.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-gcc
            cc: gcc
          - os: ubuntu-latest
            name: linux-clang
            cc: clang
          - os: macos-latest
            name: macos-clang
            cc: clang
          - os: windows-latest
            name: windows-gnu
            cc: gcc
            target: x86_64-pc-windows-gnu
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Install WinLibs GCC and Clang
        if: runner.os == 'Windows'
        uses: bwoodsend/setup-winlibs-action@v1
        with:
          # The GCC job also tests resident compiler switching.
          with_clang: true

      - name: Install Linux compilers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc clang

      - name: Add the GNU Windows Rust target
        if: runner.os == 'Windows'
        run: rustup target add ${{ matrix.target }}

      - name: Show detected C compilers
        shell: bash
        run: |
          for c in cc gcc clang; do
            command -v "$c" >/dev/null 2>&1 && echo "$c -> $(command -v "$c")" || true
          done

      - name: Build release binary
        shell: bash
        run: |
          if [[ -n "${{ matrix.target }}" ]]; then
            cargo build --release --target "${{ matrix.target }}"
          else
            cargo build --release
          fi

      - name: Stage binary
        shell: bash
        run: |
          mkdir stage
          bin="target/release/c-shell"
          if [[ -n "${{ matrix.target }}" ]]; then
            bin="target/${{ matrix.target }}/release/c-shell"
          fi
          [[ -f "$bin.exe" ]] && bin="$bin.exe"
          cp "$bin" stage/

      - uses: actions/upload-artifact@v4
        with:
          name: c-shell-dev-${{ matrix.name }}
          path: stage/

      - name: Test
        shell: bash
        run: |
          if [[ -n "${{ matrix.target }}" ]]; then
            cargo test --all-targets --target "${{ matrix.target }}"
          else
            cargo test --all-targets
          fi
