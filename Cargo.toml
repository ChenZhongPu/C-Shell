[package]
name = "c-shell"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rustyline = { version = "14", features = ["derive"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tempfile = "3"
which = "6"
wait-timeout = "0.2"

[profile.release]
strip = true
